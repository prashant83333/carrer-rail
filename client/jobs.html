<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Jobs — CareerRail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
</head>
<body>

<header class="navbar" id="navbar"></header>

<section style="background:var(--navy-950);padding:40px 0 30px">
  <div class="container">
    <h1 style="color:#fff;font-size:1.8rem">Browse jobs</h1>
    <p style="color:rgba(255,255,255,0.6);margin-top:6px">Search and filter openings that match what you're looking for.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="jobs-layout">
      <aside class="filter-panel">
        <h4>Search</h4>
        <div class="form-group">
          <input type="text" id="fQ" placeholder="Title, skill or company">
        </div>
        <div class="form-group">
          <input type="text" id="fLocation" placeholder="Location">
        </div>
        <h4 class="mt-16">Job type</h4>
        <div class="form-group">
          <select id="fJobType">
            <option value="">All types</option>
            <option>Full-time</option>
            <option>Part-time</option>
            <option>Internship</option>
            <option>Contract</option>
          </select>
        </div>
        <h4>Work mode</h4>
        <div class="form-group">
          <select id="fWorkMode">
            <option value="">Any mode</option>
            <option>Onsite</option>
            <option>Remote</option>
            <option>Hybrid</option>
          </select>
        </div>
        <h4>Experience</h4>
        <div class="form-group">
          <select id="fExperience">
            <option value="">Any experience</option>
            <option>Fresher</option>
            <option>0-1 years</option>
            <option>1-3 years</option>
            <option>3-5 years</option>
            <option>5+ years</option>
          </select>
        </div>
        <h4>Minimum salary (₹/yr)</h4>
        <div class="form-group">
          <input type="number" id="fMinSalary" placeholder="e.g. 300000">
        </div>
        <button class="btn btn-primary btn-block" id="applyFilters">Apply filters</button>
        <button class="btn btn-ghost btn-block mt-8" id="clearFilters">Clear all</button>
      </aside>

      <div>
        <div class="flex-between mb-16">
          <p class="text-muted" id="resultCount">Loading jobs...</p>
        </div>
        <div class="grid grid-3" id="jobsGrid"><div class="spinner"></div></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="container">
    <div class="footer-bottom">© 2026 CareerRail. Built for students &amp; recruiters.</div>
  </div>
</footer>

<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  renderNavbar('jobs');

  let currentPage = 1;

  function getParams() {
    const usp = new URLSearchParams(window.location.search);
    return {
      q: usp.get('q') || '',
      location: usp.get('location') || ''
    };
  }

  function fillFromUrl() {
    const p = getParams();
    document.getElementById('fQ').value = p.q;
    document.getElementById('fLocation').value = p.location;
  }

  function buildQuery(page = 1) {
    const params = new URLSearchParams();
    const q = document.getElementById('fQ').value.trim();
    const location = document.getElementById('fLocation').value.trim();
    const jobType = document.getElementById('fJobType').value;
    const workMode = document.getElementById('fWorkMode').value;
    const experience = document.getElementById('fExperience').value;
    const minSalary = document.getElementById('fMinSalary').value;

    if (q) params.set('q', q);
    if (location) params.set('location', location);
    if (jobType) params.set('jobType', jobType);
    if (workMode) params.set('workMode', workMode);
    if (experience) params.set('experience', experience);
    if (minSalary) params.set('minSalary', minSalary);
    params.set('page', page);
    params.set('limit', 9);
    return params.toString();
  }

  async function loadJobs(page = 1) {
    currentPage = page;
    const grid = document.getElementById('jobsGrid');
    grid.innerHTML = '<div class="spinner"></div>';
    try {
      const data = await apiRequest(`/jobs?${buildQuery(page)}`);
      document.getElementById('resultCount').textContent = `${data.total} job${data.total === 1 ? '' : 's'} found`;

      if (!data.jobs.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="icon">🔍</div><h3>No jobs match your filters</h3><p>Try broadening your search or clearing some filters.</p></div>`;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      grid.innerHTML = data.jobs.map(jobCardHtml).join('');
      renderPagination(data.page, data.pages);
    } catch (err) {
      grid.innerHTML = `<p class="text-muted">Couldn't load jobs right now.</p>`;
    }
  }

  function renderPagination(page, pages) {
    const el = document.getElementById('pagination');
    if (pages <= 1) { el.innerHTML = ''; return; }
    let html = '';
    for (let i = 1; i <= pages; i++) {
      html += `<button class="${i === page ? 'active' : ''}" onclick="loadJobs(${i})">${i}</button>`;
    }
    el.innerHTML = html;
  }

  function jobCardHtml(job) {
    const user = Auth.getUser();
    const isJobSeeker = user && user.role === 'user';
    const isSaved = isJobSeeker && (user.savedJobs || []).some((j) => String(j) === String(job._id) || String(j._id) === String(job._id));
    const skills = (job.skillsRequired || []).slice(0, 3);

    return `
      <div class="card job-card" style="position:relative">
        ${isJobSeeker ? `<button class="save-heart" onclick="event.preventDefault();quickToggleSave('${job._id}', this)" title="Save job">${isSaved ? '❤️' : '🤍'}</button>` : ''}
        <a href="job-detail.html?id=${job._id}" style="text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:12px">
          <div class="job-card-top">
            <div>
              <div class="job-title">${escapeHtml(job.title)}</div>
              <div class="job-company">${escapeHtml(job.company)} · ${escapeHtml(job.location)}</div>
            </div>
            <div class="job-logo">${escapeHtml(job.company.charAt(0))}</div>
          </div>
          <div class="job-tags">
            <span class="tag tag-teal">${escapeHtml(job.jobType)}</span>
            <span class="tag">${escapeHtml(job.workMode)}</span>
            <span class="tag tag-amber">${escapeHtml(job.experience)}</span>
          </div>
          ${skills.length ? `<div class="job-tags">${skills.map(s => `<span class="tag">${escapeHtml(s)}</span>`).join('')}</div>` : ''}
          <div class="job-meta">
            <span class="job-salary">${formatSalary(job.minSalary, job.maxSalary)}</span>
            <span class="job-deadline">${timeAgo(job.createdAt)}</span>
          </div>
        </a>
      </div>`;
  }

  async function quickToggleSave(jobId, btnEl) {
    try {
      const data = await apiRequest(`/jobs/${jobId}/save`, { method: 'POST' });
      const updatedUser = { ...Auth.getUser(), savedJobs: data.savedJobs };
      Auth.setSession(Auth.getToken(), updatedUser);
      btnEl.textContent = data.saved ? '❤️' : '🤍';
      Toast.show(data.saved ? 'Job saved' : 'Removed from saved jobs', 'success');
    } catch (err) {
      Toast.show(err.message, 'error');
    }
  }

  document.getElementById('applyFilters').addEventListener('click', () => loadJobs(1));
  document.getElementById('clearFilters').addEventListener('click', () => {
    document.querySelectorAll('.filter-panel input, .filter-panel select').forEach(el => el.value = '');
    loadJobs(1);
  });

  fillFromUrl();
  loadJobs(1);
</script>
</body>
</html>
