<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Skillora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2.0">
<script src="js/theme.js"></script>
</head>
<body>

<header class="navbar" id="navbar"></header>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Create your account</h2>
    <p class="sub">Sign up as a job seeker or a recruiter.</p>

    <div class="role-toggle">
      <button type="button" class="active" data-role="user" id="roleUserBtn">I'm a Job Seeker</button>
      <button type="button" data-role="recruiter" id="roleRecruiterBtn">I'm a Recruiter</button>
    </div>

    <div id="alertBox" class="alert alert-error"></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" required placeholder="Your full name">
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>

      <div class="form-group" id="collegeGroup">
        <label for="college">College / University</label>
        <input type="text" id="college" placeholder="e.g. Dr. B R Ambedkar University">
      </div>
      <div class="form-group" id="companyGroup" style="display:none">
        <label for="companyName">Company name</label>
        <input type="text" id="companyName" placeholder="e.g. Acme Technologies">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signupBtn">Create account</button>
    </form>

    <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  renderNavbar('');
  if (Auth.isLoggedIn()) window.location.href = 'jobs.html';

  let selectedRole = 'user';
  const roleUserBtn = document.getElementById('roleUserBtn');
  const roleRecruiterBtn = document.getElementById('roleRecruiterBtn');
  const collegeGroup = document.getElementById('collegeGroup');
  const companyGroup = document.getElementById('companyGroup');

  function setRole(role) {
    selectedRole = role;
    roleUserBtn.classList.toggle('active', role === 'user');
    roleRecruiterBtn.classList.toggle('active', role === 'recruiter');
    collegeGroup.style.display = role === 'user' ? 'block' : 'none';
    companyGroup.style.display = role === 'recruiter' ? 'block' : 'none';
  }
  roleUserBtn.addEventListener('click', () => setRole('user'));
  roleRecruiterBtn.addEventListener('click', () => setRole('recruiter'));

  const alertBox = document.getElementById('alertBox');
  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('signupBtn');
    btn.disabled = true;
    btn.textContent = 'Creating account...';
    try {
      const data = await apiRequest('/auth/signup', {
        method: 'POST',
        body: {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          role: selectedRole,
          college: document.getElementById('college').value,
          companyName: document.getElementById('companyName').value
        }
      });
      Auth.setSession(data.token, data.user);
      window.location.href = selectedRole === 'recruiter' ? 'recruiter-dashboard.html' : 'jobs.html';
    } catch (err) {
      showAlert(alertBox, err.message);
      btn.disabled = false;
      btn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
